name: EdgeOps PR & Release Validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test & static analysis tools
        run: pip install pytest pytest-cov ruff

      - name: Run static analysis (ruff)
        run: ruff check tests/

      - name: Run automated test suite with coverage
        run: |
          mkdir -p reports
          pytest -v --cov=tests --cov-report=term-missing --junitxml=reports/junit.xml

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-reports
          path: reports/
