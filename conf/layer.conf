# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-edgeops"
BBFILE_PATTERN_meta-edgeops = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edgeops = "6"

LAYERDEPENDS_meta-edgeops = "core"
LAYERSERIES_COMPAT_meta-edgeops = "scarthgap"
